<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Organizador de documentos pessoais, offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meus Documentos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meus Documentos</title>
<style>
  :root {
    --accent: #0B3A5C;
    --on-accent: #FFFFFF;
    --bg: #EEEEEE;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --muted: #5C5F63;
    --tab-off: #6B6B6B;
    --line: #DCDCDC;
    --circle: #D9D9D9;
    --danger: #B3261E;
    --disabled: #A8A8A8;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ico { display: inline-flex; width: 24px; height: 24px; flex: none; }
  .ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Estrutura ---------- */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .top { flex: none; background: var(--surface); padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line); }
  .top-inner { height: 52px; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; padding: 0 max(4px, env(safe-area-inset-left)); }
  .top h1 { margin: 0; font-size: 17px; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; border-radius: 50%; color: var(--accent); }
  .icon-btn:active { background: rgba(0,0,0,.06); }
  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 28px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  #view > * { max-width: 560px; margin-left: auto; margin-right: auto; }
  #view > .btn { display: flex; }
  body.gate #view { background: var(--surface); }
  .tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  .tabs[hidden] { display: none; }
  .tab { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--tab-off); font-size: 12px; background: none; border: 0; }
  .tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

  /* ---------- Splash ---------- */
  #splash { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; align-items: center; justify-content: center; transition: opacity .25s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { max-width: 60vw; max-height: 40vh; object-fit: contain; }
  .logo-ph { width: 112px; height: 112px; border-radius: 28px; background: var(--circle); color: #fff; display: flex; align-items: center; justify-content: center; }
  .logo-ph .ico { width: 56px; height: 56px; }

  /* ---------- Tipografia e blocos ---------- */
  h2.title { font-size: 26px; font-weight: 700; margin: 8px 0 6px; line-height: 1.2; }
  h2.section { font-size: 16px; font-weight: 700; margin: 4px 0 12px; }
  h3.sub { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .credits { text-align: center; white-space: pre-line; margin: 20px 16px 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #E6E6E6; border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .seg-btn { min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; color: var(--muted); font-size: 15px; }
  .seg-btn[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .doc-stage { margin-bottom: 14px; }
  .doc-img { display: block; width: 100%; padding: 0; border: 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .doc-img img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; }
  .doc-empty { background: var(--surface); border-radius: var(--radius); min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
  [hidden] { display: none !important; }
  .seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  /* Visualização do documento: giro e zoom só na tela, o arquivo não muda. */
  .zstage { position: relative; overflow: hidden; background: var(--surface); border-radius: var(--radius); box-shadow: 0 1px 4px rgba(0,0,0,.15); touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .zstage.zoomed { touch-action: none; cursor: grab; }
  .zcontent { transform-origin: 0 0; }
  .rbox { position: relative; width: 100%; overflow: hidden; }
  .rimg { position: absolute; left: 50%; top: 50%; max-width: none; display: block; -webkit-user-drag: none; }
  .pdf-page { display: block; background: #fff; }
  .pdf-page + .pdf-page { border-top: 1px solid var(--line); }
  .pdf-msg { padding: 40px 16px; text-align: center; }
  .hdr-actions { display: inline-flex; align-items: center; justify-content: flex-end; }
  #hdrRight { justify-self: end; display: inline-flex; }
  .top-inner { grid-template-columns: 96px 1fr 96px; }
  .rbox { background: var(--surface); }
  #view.docview { display: flex; flex-direction: column; }
  #view.docview > * { width: 100%; flex: none; }
  #view.docview > .doc-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-bottom: 0; }
  .doc-stage > .zstage { flex: 1; min-height: 320px; }
  .doc-stage > .zstage[data-kind="pdf"] { overflow-y: auto; touch-action: pan-y; }
  .btn-add { min-height: 50px; font-size: 18px; font-weight: 700; }
  .doc-caption { margin: 8px 2px 0; font-size: 12px; color: var(--muted); text-align: center; }
  .qr-tip { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 14px; text-align: left; background: #E8F1FB; border: 1.5px solid #1F5FA8; border-radius: 12px; color: #12355E; font-size: 13px; line-height: 1.35; }
  .qr-tip .ico { width: 26px; height: 26px; color: #1F5FA8; }
  .qr-tip span.linhas { display: flex; flex-direction: column; }
  /* QR Code anexado: exibido como enviado; o tempo só oculta por privacidade. */
  .qr-wrap { background: var(--surface); border-radius: var(--radius); padding: 18px 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .qr-frame { position: relative; display: block; }
  .qr-frame img { display: block; max-width: min(100%, 320px); height: auto; margin: 0 auto; }
  .qr-frame.blurred img { filter: blur(18px); }
  .qr-again { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: auto; max-width: 100%; padding: 0 22px; }
  .qr-bar { height: 4px; background: #E3E3E3; border-radius: 2px; overflow: hidden; margin: 16px 0 8px; }
  .qr-fill { height: 100%; background: var(--accent); }
  .qr-time { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 0 0 8px; }
  .qr-note { margin: 0; }
  .wthumb { width: 64px; height: 64px; border-radius: 10px; background: #F0F0F0; overflow: hidden; flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .wthumb img { width: 100%; height: 100%; object-fit: cover; }
  .wthumb-round { border-radius: 50%; }
  .profile-slot { display: flex; justify-content: center; margin-bottom: 16px; }
  .profile-slot .slot { width: 180px; align-items: center; }
  .pdf-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .icon-preview { display: flex; justify-content: center; margin: 8px 0 12px; }
  .icon-preview img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .sheet .list { margin: 8px 0 12px; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .stack > * + * { margin-top: 12px; }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .row-actions > .btn { flex: 1 1 140px; }

  /* ---------- Botões ---------- */
  .btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; width: 100%; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-radius: 26px; min-height: 52px; font-size: 17px; }
  .btn.primary:disabled { background: var(--disabled); color: #fff; cursor: default; }
  .btn.outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.danger-outline { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
  .btn.small { min-height: 44px; width: auto; padding: 0 14px; font-size: 15px; }
  .btn:active:not(:disabled) { filter: brightness(.92); }

  /* ---------- Formulários ---------- */
  .field { margin-bottom: 14px; }
  .field label, .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .input, .field input[type=text], .field textarea {
    width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid #9A9A9A; border-radius: 10px; background: #fff; font-size: 16px;
  }
  .field textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
  .pw-wrap { position: relative; }
  .pw-wrap .input { padding-right: 52px; }
  .pw-wrap .icon-btn { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .err { color: var(--danger); font-size: 14px; font-weight: 600; min-height: 20px; margin: 4px 0 8px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } #splash { transition: none; } }

  /* ---------- Login ---------- */
  .gate-logo { display: flex; justify-content: center; margin: 12px 0 28px; }
  .gate-logo img { max-width: 70%; max-height: 140px; object-fit: contain; }
  .forgot { display: block; text-align: right; color: var(--accent); font-weight: 600; text-decoration: none; padding: 10px 0; margin-bottom: 18px; }
  .gate-footer { text-align: center; margin-top: 28px; color: var(--muted); }
  .gate-footer a { color: var(--accent); font-weight: 700; text-decoration: none; display: inline-block; padding: 12px 6px; }

  /* ---------- Lista de documentos ---------- */
  .wcard { width: 100%; display: flex; align-items: center; gap: 16px; background: var(--surface); border: 0; border-radius: 10px; padding: 18px 16px; margin-bottom: 16px; text-align: left; min-height: 118px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--circle); overflow: hidden; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .wlines { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .wlines span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wl1 { font-size: 13px; color: var(--muted); }
  .wl2 { font-weight: 700; font-size: 17px; }
  .wl3 { font-size: 14px; color: var(--muted); }
  .chev { color: var(--tab-off); }

  /* ---------- Listas (Serviços / Opções) ---------- */
  .list { list-style: none; margin: 0 0 16px; padding: 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .list li + li .lrow { border-top: 1px solid var(--line); }
  .lrow { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 64px; background: none; border: 0; text-align: left; text-decoration: none; color: inherit; }
  .lrow:active { background: #F6F6F6; }
  .lrow .txt { flex: 1; min-width: 0; }
  .circle { width: 40px; height: 40px; border-radius: 50%; background: #E3E3E3; color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
  .circle .ico { width: 22px; height: 22px; }
  .no-callout { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  /* ---------- Imagens ---------- */
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .slot { background: #F5F5F5; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .slot .label { margin: 0; }
  .slot-preview { width: 100%; aspect-ratio: 1.6; border: 1.5px dashed #A0A0A0; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); padding: 0; }
  .slot-preview.round { width: 96px; height: 96px; aspect-ratio: auto; border-radius: 50%; margin: 0 auto; background: var(--circle); border-style: solid; border-color: transparent; color: #fff; }
  .slot-preview img { width: 100%; height: 100%; object-fit: cover; }
  .slot-preview.has { border-style: solid; border-color: transparent; }
  .slot .row-actions .btn { flex: 1 1 auto; padding: 0 8px; }
  .checker { background-color: #fff; background-image: conic-gradient(#CFCFCF 25%, #fff 0 50%, #CFCFCF 0 75%, #fff 0); background-size: 18px 18px; border-radius: 12px; min-height: 160px; display: flex; align-items: center; justify-content: center; padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .checker img { max-width: 100%; max-height: 180px; object-fit: contain; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 12px; }
  .thumb { border: 0; padding: 0; background: #F2F2F2; border-radius: 8px; aspect-ratio: 1; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Modal / Visualizador / Toast ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 90dvh; overflow-y: auto; }
  .sheet h2 { font-size: 19px; margin: 0 0 12px; }
  .sheet .row-actions { margin-top: 8px; }
  @media (min-width: 640px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; } }
  .viewer { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer .icon-btn { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 8px; color: #fff; background: rgba(255,255,255,.15); }
  #toast { position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 70; background: #222; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }

  /* ---------- FAQ ---------- */
  details.faq { background: var(--surface); border-radius: 12px; margin-bottom: 10px; }
  details.faq summary { padding: 14px 16px; font-weight: 600; min-height: 48px; cursor: pointer; }
  details.faq .faq-body { padding: 0 16px 14px; white-space: pre-wrap; }
  .files { list-style: none; padding: 0; margin: 0 0 12px; }
  .files li { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 8px 8px 8px 12px; margin-bottom: 8px; }
  .files .fopen { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 0; min-height: 44px; display: flex; align-items: center; gap: 10px; }
  .files .fname { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .fsize { display: block; font-size: 13px; color: var(--muted); }

  /* ---------- Chat ---------- */
  #view.chat { display: flex; flex-direction: column; padding: 0; }
  #view.chat > * { max-width: none; width: 100%; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; }
  .msg time { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }
  .composer { flex: none; display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid var(--line); }
  .composer .input { flex: 1; min-height: 48px; }
  .composer .icon-btn { background: var(--accent); color: var(--on-accent); }

  /* ---------- Interruptor ---------- */
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch { width: 56px; height: 34px; border-radius: 17px; border: 0; background: #9E9E9E; position: relative; flex: none; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }
  .switch[aria-disabled="true"] { opacity: .55; }
  .notice { background: #FFF4E5; color: #5A3B00; border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-top: 12px; }
  .prose { white-space: pre-wrap; }
  .color-row { display: flex; align-items: center; gap: 12px; }
  .color-row input[type=color] { width: 56px; height: 48px; border: 1px solid #9A9A9A; border-radius: 10px; padding: 2px; background: #fff; }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"></div>
<div id="app">
  <header class="top">
    <div class="top-inner">
      <span id="hdrLeft"></span>
      <h1 id="hdrTitle" tabindex="-1"></h1>
      <span id="hdrRight"></span>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabbar" aria-label="Navegação principal" hidden>
    <button class="tab" type="button" data-tab="carteira" data-href="#/carteira"></button>
    <button class="tab" type="button" data-tab="servicos" data-href="#/servicos"></button>
    <button class="tab" type="button" data-tab="opcoes" data-href="#/opcoes"></button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Ative o JavaScript para usar este aplicativo.</noscript>

<script src="lib.js"></script>
<script>
'use strict';

/* Servidor do portão de acesso (aprovação manual), no Cloudflare Workers (gratuito).
   Deixar vazio ('') desliga o portão. */
const ACCESS_SERVER = 'https://servidor-acesso.servidor-acesso.workers.dev';

/* ======================================================================
   Ícones SVG (conteúdo estático, nunca dados do usuário)
   ====================================================================== */
const ICONS = {
  wallet: '<path d="M4 7.5V6a2 2 0 0 1 2-2h11"/><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M21 11.5h-4a2 2 0 0 0 0 4h4"/>',
  tagHeart: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><path d="M8.6 8.6c.7-1 2.2-.9 2.6.3.4-1.2 1.9-1.3 2.6-.3.7 1 0 2.3-2.6 4.1-2.6-1.8-3.3-3.1-2.6-4.1z"/>',
  menu: '<path d="M4 6.5h16M4 12h16M4 17.5h16"/>',
  chevR: '<path d="m9 6 6 6-6 6"/>',
  chevL: '<path d="m15 6-6 6 6 6"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3.5 3.5l17 17"/>',

      if (!migrated) {
        const legacy = store.get(K.wallets);
        const now = Date.now();
        const list = (Array.isArray(legacy) ? legacy : DEF.wallets()).filter((o) => o && typeof o === 'object').map((o, i) => legacyToDoc(o, i, now));

      else if (r.status === 401) this.set(null); // pedido não existe mais no servidor

/* Confere de novo ao voltar para o app e a cada 5 minutos; se mudou, refaz a tela. */

/* ======================================================================
   Autenticação: só guarda salt + hash. Biometria via WebAuthn local.
   ====================================================================== */
const auth = {
  get() {
    const v = store.get(K.auth) || {};
    const bio = v.bio && typeof v.bio === 'object' ? v.bio : {};
    return {
      salt: str(v.salt, '', 64), hash: str(v.hash, '', 64), none: v.none === true,
      bio: { enabled: bio.enabled === true && typeof bio.credId === 'string', credId: str(bio.credId, '', 1024) }
    };
  },
  hasPassword() { const a = this.get(); return /^[0-9a-f]{64}$/.test(a.hash) && a.salt.length >= 16; },
  /* Senha é opcional: "configurado" = tem senha ou o usuário escolheu entrar sem senha. */
  configured() { return this.hasPassword() || this.get().none; },
  clear() { return store.set(K.auth, { salt: '', hash: '', none: true, bio: { enabled: false, credId: '' } }); },
  async setPassword(pw) {
    const a = this.get();
    a.salt = toHex(randBytes(16));
    a.hash = await sha256Hex(a.salt + ':' + pw);
    a.none = false;
    return store.set(K.auth, a);
  },
  async check(pw) {
    const a = this.get();
    if (!a.hash) return false;
    return (await sha256Hex(a.salt + ':' + pw)) === a.hash;
  },
  setBio(bio) { const a = this.get(); a.bio = bio; return store.set(K.auth, a); }
};

async function bioSupport() {
  if (!window.isSecureContext) return { ok: false, reason: 'A biometria só funciona em conexão segura (HTTPS). Abra o aplicativo por um endereço https:// para ativar.' };
  if (!window.PublicKeyCredential || !navigator.credentials) return { ok: false, reason: 'Este navegador não oferece acesso por biometria (WebAuthn).' };
  try {
    const ok = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if (!ok) return { ok: false, reason: 'Nenhum leitor de digital ou reconhecimento facial disponível neste aparelho ou navegador.' };
  } catch (e) {
    return { ok: false, reason: 'Não foi possível verificar a biometria neste aparelho.' };
  }
  return { ok: true };
}
async function bioRegister() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: randBytes(32),
    rp: { name: db.settings().appName },
    user: { id: randBytes(16), name: 'usuario-local', displayName: 'Usuário' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    timeout: 60000, attestation: 'none'
  } });
  return b64url(cred.rawId);
}
async function bioVerify(credId) {
  const res = await navigator.credentials.get({ publicKey: {
    challenge: randBytes(32), timeout: 60000, userVerification: 'required',
    allowCredentials: [{ type: 'public-key', id: fromB64url(credId) }]
  } });
  return !!res;
}

/* ======================================================================
   Imagens: compressão via canvas antes de salvar
   doc: máx. 1024 px, JPEG 0,8 · logo: máx. 512 px, sempre PNG
   avatar: máx. 512 px, PNG se houver transparência, senão JPEG
   ====================================================================== */
async function compressImage(file, kind) {
  const max = kind === 'doc' ? 1024 : kind === 'mold' ? 1400 : 512;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('imagem inválida'));
      i.src = url;
    });
    let w = img.naturalWidth, ht = img.naturalHeight;
    if (!w || !ht) throw new Error('imagem vazia');
    const s = Math.min(1, max / Math.max(w, ht));
    w = Math.max(1, Math.round(w * s)); ht = Math.max(1, Math.round(ht * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = ht;
    const ctx = c.getContext('2d');
    if (kind === 'doc' || kind === 'mold') {
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, ht);
      ctx.drawImage(img, 0, 0, w, ht);
      return c.toDataURL('image/jpeg', kind === 'mold' ? 0.88 : 0.8);
    }
    ctx.drawImage(img, 0, 0, w, ht);
    if (kind === 'logo') return c.toDataURL('image/png'); // preserva o canal alpha
    const px = ctx.getImageData(0, 0, w, ht).data;
    let alpha = false;
    for (let i = 3; i < px.length; i += 4) if (px[i] < 255) { alpha = true; break; }
    return alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85);
  } finally {
    URL.revokeObjectURL(url);
  }
}
/* Ícone da tela de início: PNG quadrado 512x512, sem transparência (recorte central). */
async function makeIcon(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagem inválida')); i.src = url; });
    const w = img.naturalWidth, ht = img.naturalHeight;
    if (!w || !ht) throw new Error('imagem vazia');
    const side = Math.min(w, ht);
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 512, 512);
    ctx.drawImage(img, (w - side) / 2, (ht - side) / 2, side, side, 0, 0, 512, 512);
    return c.toDataURL('image/png');
  } finally { URL.revokeObjectURL(url); }
}
const readDataURL = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(file);
});

/* Encaminhar: coloca a foto do documento no molde (Personalizar) e abre o compartilhamento. */
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagem inválida')); i.src = src; });
async function composeShare(src) {
  const doc = await loadImg(src);
  const moldSrc = db.settings().mold;
  const mold = moldSrc ? await loadImg(moldSrc) : null;
  const W = mold ? mold.naturalWidth : doc.naturalWidth, H = mold ? mold.naturalHeight : doc.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (mold) {
    ctx.drawImage(mold, 0, 0, W, H);
    // foto no meio, um pouco abaixo do centro
    const s = Math.min((W * 0.8) / doc.naturalWidth, (H * 0.5) / doc.naturalHeight);
    const dw = doc.naturalWidth * s, dh = doc.naturalHeight * s;
    ctx.drawImage(doc, (W - dw) / 2, H * 0.56 - dh / 2, dw, dh);
  } else ctx.drawImage(doc, 0, 0, W, H);
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('falha'))), 'image/jpeg', 0.92));
}
async function shareDocImage(src, title) {
  let blob;
  try { blob = await composeShare(src); } catch (e) { return ui.toast('Não foi possível preparar a imagem.'); }
  const name = (title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'documento') + '.jpg';
  const file = new File([blob], name, { type: 'image/jpeg' });
  const download = () => {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    ui.toast('Imagem salva no aparelho.');
  };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); } catch (e) { if (!e || e.name !== 'AbortError') download(); }
  } else download();
}

/* ======================================================================
   UI: toast, modal, confirmação, formulário, visualizador
   ====================================================================== */
const ui = {
  layers: [],
  toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.remove('show'), 3200);
  },
  /* Camada sobreposta com foco preso e Esc para fechar. */
  layer(el, onDismiss) {
    const prev = document.activeElement;
    const close = () => {
      el.remove();
      this.layers = this.layers.filter((l) => l.close !== close);
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.isConnected) prev.focus();
    };
    const onKey = (e) => {
      if (this.layers[this.layers.length - 1].close !== close) return;
      if (e.key === 'Escape') { e.preventDefault(); close(); onDismiss && onDismiss(); }
      if (e.key === 'Tab') {
        const f = [...el.querySelectorAll('button, input, textarea, a[href], [tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    document.body.append(el);
    this.layers.push({ close, onDismiss });
    return close;
  },
  closeAll() { [...this.layers].reverse().forEach((l) => { l.close(); l.onDismiss && l.onDismiss(); }); },
  modal({ title, body, actions, onDismiss }) {
    const tid = 'm' + uid();
    const form = h('form', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': tid, novalidate: true },
      h('h2', { id: tid }, title), body,
      h('div', { class: 'row-actions' }, actions.map((a) =>
        h('button', { type: a.submit ? 'submit' : 'button', class: 'btn ' + (a.kind || 'outline'), onclick: a.submit ? null : a.onClick }, a.label)))
    );
    const submitAct = actions.find((a) => a.submit);
    form.addEventListener('submit', (e) => { e.preventDefault(); submitAct && submitAct.onClick(); });
    const back = h('div', { class: 'backdrop' }, form);
    back.addEventListener('click', (e) => { if (e.target === back) { close(); onDismiss && onDismiss(); } });
    const close = this.layer(back, onDismiss);
    setTimeout(() => {
      const first = form.querySelector('input, textarea') || form.querySelector('button[type=submit]') || form.querySelector('button');
      first && first.focus();
    }, 30);
    return close;
  },
  confirm(title, message, okLabel = 'Confirmar', danger = false) {
    return new Promise((resolve) => {
      let done = false;
      const end = (v) => { if (!done) { done = true; resolve(v); } };
      const close = this.modal({
        title, body: h('p', { class: 'muted' }, message), onDismiss: () => end(false),
        actions: [
          { label: 'Cancelar', kind: 'outline', onClick: () => { close(); end(false); } },
          { label: okLabel, kind: danger ? 'danger' : 'primary', submit: true, onClick: () => { close(); end(true); } }
        ]
      });
    });
  },
  form(title, fields, okLabel = 'Salvar') {
    return new Promise((resolve) => {
      let done = false;
      const end = (v) => { if (!done) { done = true; resolve(v); } };
      const inputs = {};
      const body = h('div', null, fields.map((f) => {
        const id = 'f' + uid();
        const el = f.multiline
          ? h('textarea', { id, rows: f.rows || 6, maxlength: f.max || 5000 })
          : h('input', { id, type: 'text', maxlength: f.max || 200, autocomplete: 'off' });
        el.value = f.value || '';
        inputs[f.name] = el;
        return h('div', { class: 'field' }, h('label', { for: id }, f.label), el);
      }));
      const close = this.modal({
        title, body, onDismiss: () => end(null),
        actions: [
          { label: 'Cancelar', kind: 'outline', onClick: () => { close(); end(null); } },
          { label: okLabel, kind: 'primary', submit: true, onClick: () => {
            const out = {};
            for (const k in inputs) out[k] = inputs[k].value;
            close(); end(out);
          } }
        ]
      });
    });
  },
  viewer(src, label) {
    const closeBtn = h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Fechar imagem' }, icon('close'));
    const el = h('div', { class: 'viewer', role: 'dialog', 'aria-modal': 'true', 'aria-label': label || 'Imagem' },
      h('img', { src, alt: label || 'Imagem' }), closeBtn);
    const close = this.layer(el);
    el.addEventListener('click', () => close());
    setTimeout(() => closeBtn.focus(), 30);
  }
};

function luminance(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.substr(i, 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}

function applySettings() {

  root.setProperty('--accent', s.accent);

  document.title = s.appName;
  // Ícone: iPhone lê o apple-touch-icon; Android lê o manifest (servido pelo Service Worker).
  const iconHref = s.icon || 'icon-192.png';

  $('link[rel="icon"]').setAttribute('href', iconHref);
  $('meta[name="apple-mobile-web-app-title"]').setAttribute('content', s.appName);
  // Envia nome e cor para o Service Worker personalizar o manifest.json.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then((reg) => reg.active && reg.active.postMessage({ type: 'config', name: s.appName, color: s.accent, icon: s.icon })).catch(() => {});
  }
}

/* ======================================================================
   Router (SPA por hash)
   ====================================================================== */
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  return { name: parts[0] || '', param: parts[1] ? decodeURIComponent(parts[1]) : '' };
}
function go(hash, opts = {}) {
  if (location.hash === hash) render();
  else if (opts.replace) location.replace(hash);
  else location.hash = hash;
}
function render() {
  ui.closeAll();
  const { name, param } = parseRoute();
  view.replaceChildren();
  view.className = '';
  view.scrollTop = 0;
  document.body.classList.remove('gate');
  setHeader('');
  if (ACCESS_SERVER) { const st = gate.status(); if (st !== 'liberado') return screens.acesso(st); }
  if (!auth.configured()) return screens.setup();
  if (!app.unlocked && !auth.hasPassword()) app.unlocked = true; // sem senha: abre direto
  if (!app.unlocked) {
    if (name === 'faq') return screens.faq();
    if (name === 'texto') return screens.texto(param);
    if (name === 'esqueci') return screens.esqueci();
    return screens.login();
  }
  switch (name) {
    case 'carteira': return !param ? screens.carteira() : param === 'nova' ? screens.walletForm('nova') : screens.walletView(param);
    case 'editar': return screens.walletForm(param);
    case 'servicos': return screens.servicos();
    case 'servico': return screens.servico(param);
    case 'opcoes': return screens.opcoes();
    case 'senha': return screens.senha();
    case 'biometria': return screens.biometria();
    case 'faq': return screens.faq();
    case 'chat': return screens.chat();
    case 'texto': return screens.texto(param);
    case 'personalizar': return screens.personalizar();
    case 'imagens': return screens.imagens();
    default: return go('#/carteira', { replace: true });
  }
}
function unlock() {
  app.unlocked = true;
  const { name } = parseRoute();
  if (!name || name === 'esqueci' || name === 'login') go('#/carteira'); else render();
}
function resetAll() {
  Object.values(K).concat(MIGRATED_KEY, GATE_KEY).forEach((k) => { try { localStorage.removeItem(k); } catch (e) { /* ignora */ } });
  const reload = () => location.replace(location.pathname + location.search);
  try {
    if (idb.db) idb.db.close();
    const r = indexedDB.deleteDatabase('pwc');
    r.onsuccess = r.onerror = r.onblocked = reload;
  } catch (e) { reload(); }
}

/* Zoom por pinça, duplo toque e arrastar (só na tela). */
function attachZoom(stage, content) {
  let s = 1, tx = 0, ty = 0, lastTap = 0, lastD = 0, moved = false, start = null;
  const pts = new Map();
  const local = (e) => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const clamp = () => {
    const W = stage.clientWidth, H = stage.clientHeight;
    tx = Math.min(0, Math.max(W - W * s, tx)); ty = Math.min(0, Math.max(H - H * s, ty));
  };
  const apply = () => {
    content.style.transform = s === 1 ? '' : 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    stage.classList.toggle('zoomed', s > 1);
    stage.dataset.zoom = s.toFixed(2);
  };
  const zoomAt = (ns, cx, cy) => {
    ns = Math.min(5, Math.max(1, ns));
    tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); s = ns;
    if (s === 1) { tx = 0; ty = 0; }
    clamp(); apply();
  };
  stage.addEventListener('pointerdown', (e) => {
    pts.set(e.pointerId, local(e));
    moved = false; start = local(e);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; lastD = Math.hypot(a[0] - b[0], a[1] - b[1]); }
    if (s > 1 || pts.size === 2) { try { stage.setPointerCapture(e.pointerId); } catch (x) { /* ignora */ } }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const p = local(e), prev = pts.get(e.pointerId);
    pts.set(e.pointerId, p);
    if (start && Math.hypot(p[0] - start[0], p[1] - start[1]) > 8) moved = true;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (lastD > 0) zoomAt(s * (d / lastD), (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      lastD = d;
    } else if (s > 1) { tx += p[0] - prev[0]; ty += p[1] - prev[1]; clamp(); apply(); }
  });
  const end = (e) => {
    const wasSingle = pts.size === 1;
    pts.delete(e.pointerId);
    if (pts.size < 2) lastD = 0;
    if (e.type !== 'pointerup' || !wasSingle || moved) return;
    const now = Date.now();
    if (now - lastTap < 320) {
      lastTap = 0;
      const [x, y] = local(e);
      if (s > 1) zoomAt(1, x, y); else zoomAt(2.5, x, y);
    } else lastTap = now;
  };
  ['pointerup', 'pointercancel'].forEach((t) => stage.addEventListener(t, end));
  stage.addEventListener('dblclick', (e) => e.preventDefault());
}

/* Exibição do documento (imagem ou PDF), com orientação e giro salvos. */
let relayout = null;
window.addEventListener('resize', () => { if (relayout) relayout(); });
function docPanel(doc, key, label) {
  const blob = doc[key];
  const content = h('div', { class: 'zcontent' });
  const stage = h('div', { class: 'zstage', 'data-kind': isPdf(blob) ? 'pdf' : 'image' }, content);
  if (isPdf(blob)) {
    renderPdf(blob, stage, content, doc);
    relayout = null;
  } else {
    const img = h('img', { src: srcOf(blob), alt: label + ' do documento', class: 'rimg', draggable: 'false' });
    const box = h('div', { class: 'rbox' }, img);
    content.append(box);
    const layout = () => {
      if (!box.isConnected) return;
      const W = stage.clientWidth, iw = img.naturalWidth, ih = img.naturalHeight;
      if (!W || !iw || !ih) return;
      const H = stage.clientHeight; // quadro alto: do fim das abas até a barra inferior
      if (!H) return;
      const r = PWC.frameRotation(doc.orient, W, H, iw, ih, doc.rot);
      const f = PWC.fitContain(W, H, iw, ih, r);
      img.style.width = f.elW + 'px'; img.style.height = f.elH + 'px';
      img.style.transform = 'translate(-50%, -50%) rotate(' + r + 'deg)';
      box.style.height = H + 'px';
      stage.dataset.rotation = r;
    };
    img.addEventListener('load', () => requestAnimationFrame(layout));
    requestAnimationFrame(layout);
    relayout = layout;
  }
  attachZoom(stage, content);
  return stage;
}

/* PDF com pdf.js (copiado em ./vendor), todas as páginas em rolagem vertical. */
let pdfjsP = null;
function loadPdfjs() {
  if (!pdfjsP) {
    pdfjsP = import('./vendor/pdf.min.mjs').then((m) => { m.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs'; return m; });
    pdfjsP.catch(() => { pdfjsP = null; });
  }
  return pdfjsP;
}
async function renderPdf(blob, stage, content, doc) {
  content.append(h('p', { class: 'muted pdf-msg' }, 'Abrindo PDF…'));
  try {
    const pdfjs = await loadPdfjs();
    // Cópia dos bytes para o pdf.js; o Blob guardado não é tocado.
    const pdf = await pdfjs.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false }).promise;
    content.replaceChildren();
    const W = stage.clientWidth || 320;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    for (let n = 1; n <= pdf.numPages; n++) {
      if (!stage.isConnected) break;
      const page = await pdf.getPage(n);
      const v0 = page.getViewport({ scale: 1 });
      const r = PWC.frameRotation(doc.orient, W, stage.clientHeight || W * 1.6, v0.width, v0.height, doc.rot);
      const rotation = (page.rotate + r) % 360;
      const v1 = page.getViewport({ scale: 1, rotation });
      const vp = page.getViewport({ scale: (W / v1.width) * dpr, rotation });
      const c = h('canvas', { class: 'pdf-page', width: Math.floor(vp.width), height: Math.floor(vp.height), role: 'img', 'aria-label': 'Página ' + n + ' de ' + pdf.numPages });
      c.style.width = W + 'px'; c.style.height = (W * v1.height / v1.width) + 'px';
      content.append(c);
      if (n === 1) stage.dataset.rotation = r;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    stage.dataset.pages = pdf.numPages;
  } catch (e) {
    content.replaceChildren(h('div', { class: 'doc-empty' }, icon('doc'),
      h('p', { class: 'muted' }, 'Não foi possível exibir este PDF aqui.'),
      h('button', { type: 'button', class: 'btn outline small', onclick: () => openBlob(blob) }, 'Abrir PDF')));
  }
}

/* QR Code anexado: a imagem enviada, sem alteração. O tempo só oculta por privacidade. */
function qrPanel(blob) {
  const img = h('img', { src: srcOf(blob), alt: 'QR Code anexado', draggable: 'false' });
  const again = h('button', { type: 'button', class: 'btn primary qr-again', hidden: true }, 'Tocar para mostrar de novo');
  const frame = h('div', { class: 'qr-frame' }, img, again);
  const fill = h('div', { class: 'qr-fill' });
  const bar = h('div', { class: 'qr-bar', role: 'progressbar', 'aria-label': 'Tempo até ocultar o QR Code', 'aria-valuemin': 0, 'aria-valuemax': PWC.QR_SECONDS }, fill);
  const time = h('p', { class: 'qr-time' });
  let started = Date.now(), seen = false;
  const tick = () => {
    if (frame.isConnected) seen = true;
    else if (seen) { clearInterval(timer); return; }
    const st = PWC.qrState(started, Date.now());
    time.textContent = PWC.fmtTimer(st.remaining);
    fill.style.width = (st.progress * 100) + '%';
    bar.setAttribute('aria-valuenow', st.remaining);
    frame.classList.toggle('blurred', st.blurred);
    again.hidden = !st.blurred;
  };
  const timer = setInterval(tick, 250);
  again.addEventListener('click', () => { started = Date.now(); tick(); });
  tick();
  return h('div', { class: 'qr-wrap' }, frame, bar, time,
    h('div', { class: 'qr-tip', role: 'note' }, icon('bulb'),
      h('span', { class: 'linhas' }, h('span', null, 'O QR Code é a imagem que você anexou.'), h('span', null, 'O tempo serve apenas para ocultá-lo por privacidade.'))));
}

  senha() {
    setHeader('PIN de acesso', { back: '#/opcoes' }); setTabs('opcoes');
    const has = auth.hasPassword();
    const cur = pwField('PIN atual', 'current-password');
    const nw = pwField(has ? 'Novo PIN' : 'PIN', 'new-password');
    const cf = pwField('Confirme o PIN', 'new-password');
    const err = h('p', { class: 'err', role: 'alert' });
    const btn = h('button', { type: 'submit', class: 'btn primary' }, has ? 'Alterar PIN' : 'Criar PIN');
    const form = h('form', { class: 'card', novalidate: true },
      h('p', { class: 'muted small' }, has ? 'O app pede este PIN ao abrir.' : 'Sem PIN: o app abre direto. Crie um para pedir senha ao abrir.'),
      userField(), has ? cur.wrap : null, nw.wrap, cf.wrap, err, btn);
    if (has) {
      form.append(h('button', { type: 'button', class: 'btn danger-outline', style: 'margin-top:12px', onclick: async () => {
        err.textContent = '';
        if (!(await auth.check(cur.input.value))) { err.textContent = 'Digite o PIN atual para remover.'; return cur.input.focus(); }
        if (!(await ui.confirm('Remover PIN?', 'O app vai abrir sem pedir senha neste aparelho.', 'Remover', true))) return;
        if (auth.clear()) { ui.toast('PIN removido.'); go('#/opcoes', { replace: true }); }
      } }, 'Remover PIN'));
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      if (has && !(await auth.check(cur.input.value))) { err.textContent = 'PIN atual incorreto.'; vibrate(80); return cur.input.focus(); }
      if (nw.input.value.length < 4) { err.textContent = 'A nova senha precisa ter pelo menos 4 caracteres.'; return nw.input.focus(); }
      if (nw.input.value !== cf.input.value) { err.textContent = 'A confirmação não confere com a nova senha.'; return cf.input.focus(); }
      btn.disabled = true;
      if (await auth.setPassword(nw.input.value)) { ui.toast('Senha alterada.'); go('#/opcoes', { replace: true }); }
      else btn.disabled = false;
    });
    view.append(form);
  },

  async biometria() {
    setHeader('Acesso com biometria', { back: '#/opcoes' }); setTabs('opcoes');
    const a = auth.get();
    const sw = h('button', { type: 'button', class: 'switch', role: 'switch', id: 'bioSwitch', 'aria-checked': String(a.bio.enabled), 'aria-labelledby': 'bioLbl' });
    const msg = h('div', { role: 'status', 'aria-live': 'polite' });
    view.append(h('div', { class: 'card' },
      h('div', { class: 'switch-row' }, h('span', { id: 'bioLbl', class: 'wl2' }, 'Entrar com digital ou rosto'), sw),
      h('p', { class: 'muted small', style: 'margin-top:10px' }, 'Usa o leitor do próprio aparelho. A senha continua funcionando.'),
      msg));
    const support = await bioSupport();
    if (!support.ok) {
      if (a.bio.enabled) auth.setBio({ enabled: false, credId: '' });
      sw.setAttribute('aria-checked', 'false');
      sw.setAttribute('aria-disabled', 'true');
      msg.replaceChildren(h('p', { class: 'notice' }, support.reason));
    }
    sw.addEventListener('click', async () => {
      if (!support.ok) { msg.replaceChildren(h('p', { class: 'notice' }, support.reason)); return; }
      if (sw.getAttribute('aria-checked') === 'true') {
        auth.setBio({ enabled: false, credId: '' });
        sw.setAttribute('aria-checked', 'false');
        ui.toast('Biometria desativada.');
        return;
      }
      try {
        const credId = await bioRegister();
        if (auth.setBio({ enabled: true, credId })) { sw.setAttribute('aria-checked', 'true'); ui.toast('Biometria ativada.'); }
      } catch (e) {
        msg.replaceChildren(h('p', { class: 'notice' }, 'Biometria não ativada: a operação foi cancelada ou não é permitida neste aparelho.'));
      }
    });
  },

  /* --- Perguntas frequentes (editável) + anexos --- */
  faq() {
    const editable = app.unlocked;
    setHeader('Perguntas frequentes', { back: editable ? '#/opcoes' : '#/login' }); setTabs(editable ? 'opcoes' : null);
    if (!editable) document.body.classList.add('gate');
    const faq = db.faq();
    const editItem = async (i) => {
      const cur = i >= 0 ? faq[i] : { q: '', a: '' };
      const r = await ui.form(i >= 0 ? 'Editar pergunta' : 'Nova pergunta', [
        { name: 'q', label: 'Pergunta', value: cur.q, max: 300 },
        { name: 'a', label: 'Resposta', value: cur.a, multiline: true, max: 5000 }]);
      if (!r || !r.q.trim()) return;
      const next = db.faq();
      const item = { q: r.q.trim(), a: r.a.trim() };
      if (i >= 0) next[i] = item; else next.push(item);
      if (store.set(K.faq, next)) { ui.toast('Pergunta salva.'); render(); }
    };
    if (!faq.length) view.append(h('p', { class: 'muted' }, 'Nenhuma pergunta cadastrada.'));
    faq.forEach((f, i) => {
      view.append(h('details', { class: 'faq' }, h('summary', null, f.q),
        h('div', { class: 'faq-body' }, f.a,
          editable ? h('div', { class: 'row-actions', style: 'margin-top:10px' },
            h('button', { type: 'button', class: 'btn small outline', onclick: () => editItem(i) }, 'Editar'),
            h('button', { type: 'button', class: 'btn small ghost', onclick: async () => {
              if (!(await ui.confirm('Excluir pergunta?', f.q, 'Excluir', true))) return;
              const next = db.faq(); next.splice(i, 1);
              if (store.set(K.faq, next)) render();
            } }, 'Excluir')) : null)));
    });
    if (editable) view.append(h('button', { type: 'button', class: 'btn outline', style: 'margin:6px 0 24px', onclick: () => editItem(-1) }, icon('plus'), 'Adicionar pergunta'));

    view.append(h('h2', { class: 'section', style: 'margin-top:16px' }, 'Arquivos'));
    const files = db.faqFiles();
    const ul = h('ul', { class: 'files', id: 'faqFiles' });
    if (!files.length) view.append(h('p', { class: 'muted' }, editable ? 'Nenhum arquivo anexado. Anexe imagens ou PDF.' : 'Nenhum arquivo anexado.'));
    files.forEach((f) => {
      ul.append(h('li', null,
        h('button', { type: 'button', class: 'fopen', onclick: () => openFile(f), 'aria-label': 'Abrir ' + f.name },
          h('span', { class: 'circle' }, icon(f.type === 'pdf' ? 'doc' : 'image')),
          h('span', { style: 'min-width:0' }, h('span', { class: 'fname' }, f.name), h('span', { class: 'fsize' }, (f.type === 'pdf' ? 'PDF' : 'Imagem') + ' · ' + fmtSize(f.size)))),
        editable ? h('button', { type: 'button', class: 'btn small ghost', 'aria-label': 'Remover ' + f.name, onclick: async () => {
          if (!(await ui.confirm('Remover arquivo?', f.name, 'Remover', true))) return;
          if (store.set(K.faqFiles, db.faqFiles().filter((x) => x.id !== f.id))) { ui.toast('Arquivo removido.'); render(); }
        } }, 'Remover') : null));
    });
    view.append(ul);
    if (editable) {
      const input = h('input', { type: 'file', id: 'faqFileInput', accept: 'image/*,application/pdf', multiple: true, class: 'sr-only', tabindex: '-1', 'aria-label': 'Escolher arquivos' });
      const btn = h('button', { type: 'button', class: 'btn outline', onclick: () => input.click() }, 'Anexar arquivo');
      input.addEventListener('change', async () => {
        const chosen = [...(input.files || [])];
        input.value = '';
        let added = 0;
        for (const file of chosen) {
          try {
            let data;
            if (file.type === 'application/pdf') {
              if (file.size > 3 * 1048576) { ui.toast('"' + file.name + '" é grande demais. Use PDFs de até 3 MB.'); continue; }
              data = await readDataURL(file);
            } else if (/^image\//.test(file.type)) {
              data = await compressImage(file, 'doc');
            } else { ui.toast('"' + file.name + '" não é imagem nem PDF.'); continue; }
            if (!isFileData(data)) { ui.toast('Não foi possível ler "' + file.name + '".'); continue; }
            const next = db.faqFiles();
            next.push({ id: uid(), name: file.name.slice(0, 120), data });
            if (!store.set(K.faqFiles, next)) break;
            added++;
          } catch (e) { ui.toast('Não foi possível ler "' + file.name + '".'); }
        }
        if (added) { ui.toast(added === 1 ? 'Arquivo anexado.' : added + ' arquivos anexados.'); render(); }
      });
      view.append(input, btn);
    }
  },

  /* --- Chat local offline --- */
  chat() {
    setTabs('opcoes');
    const cfgBtn = h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Configurar resposta automática', onclick: async () => {
      const c = db.chat();
      const r = await ui.form('Resposta automática', [{ name: 'auto', label: 'Mensagem enviada após cada mensagem sua', value: c.auto, multiline: true, max: 1000 }]);
      if (!r) return;
      c.auto = r.auto.trim();
      if (store.set(K.chat, c)) ui.toast('Resposta automática salva.');
    } }, icon('gear'));
    setHeader('Chat de atendimento', { back: '#/opcoes', action: cfgBtn });
    view.className = 'chat';
    const list = h('div', { class: 'msgs', role: 'log', 'aria-live': 'polite', 'aria-label': 'Mensagens' });
    const paint = () => {
      const c = db.chat();
      list.replaceChildren();
      if (!c.msgs.length) list.append(h('p', { class: 'muted', style: 'text-align:center;margin-top:24px' }, 'Envie uma mensagem para começar.'));
      c.msgs.forEach((m) => list.append(h('div', { class: 'msg ' + m.from }, m.text,
        h('time', null, new Date(m.t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })))));
      list.scrollTop = list.scrollHeight;
    };
    const input = h('input', { class: 'input', id: 'chatInput', type: 'text', maxlength: 2000, autocomplete: 'off', placeholder: 'Escreva uma mensagem' });
    const form = h('form', { class: 'composer' }, h('label', { for: 'chatInput', class: 'sr-only' }, 'Mensagem'), input,
      h('button', { type: 'submit', class: 'icon-btn', 'aria-label': 'Enviar mensagem' }, icon('send')));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const c = db.chat();
      c.msgs.push({ from: 'me', text, t: Date.now() });
      if (!store.set(K.chat, c)) return;
      input.value = '';
      paint();
      if (c.auto) setTimeout(() => {
        const c2 = db.chat();
        c2.msgs.push({ from: 'bot', text: c2.auto || DEF.autoReply, t: Date.now() });
        c2.msgs = c2.msgs.slice(-200);
        if (store.set(K.chat, c2) && list.isConnected) paint();
      }, 700);
    });
    view.append(list, form);
    paint();
  },

    view.append(h('section', { class: 'card' },
      h('h2', { class: 'section' }, 'Molde do arquivo'),
      h('div', { class: 'checker', id: 'moldPreview' }, s.mold ? h('img', { src: s.mold, alt: 'Molde atual' }) : h('span', { class: 'muted' }, 'Nenhum molde enviado')),
      h('p', { class: 'muted small' }, 'Ao encaminhar um documento (seta no topo da tela dele), a foto é colocada no meio deste desenho, um pouco para baixo. Sem molde, a foto vai sozinha.'),
      moldInput,
      h('div', { class: 'row-actions' },
        h('button', { type: 'button', class: 'btn outline', onclick: () => moldInput.click() }, s.mold ? 'Trocar molde' : 'Enviar molde'),
        s.mold ? h('button', { type: 'button', class: 'btn ghost', onclick: () => { if (saveSettings({ mold: null }, 'Molde removido.')) render(); } }, 'Remover molde') : null)));

    // Orientação padrão dos documentos (usada ao anexar; pode trocar por documento)
    const orientPadrao = h('div', { class: 'seg', role: 'group', 'aria-label': 'Orientação padrão dos documentos', id: 'orientPadrao', style: 'grid-template-columns:1fr 1fr' },
      [['h', 'Horizontal'], ['v', 'Vertical']].map(([k, t]) => h('button', { type: 'button', class: 'seg-btn', 'data-orient': k, 'aria-pressed': String(s.orient === k),
        onclick: () => { if (saveSettings({ orient: k }, 'Orientação padrão: ' + t + '.')) render(); } }, t)));
    view.append(h('section', { class: 'card' },
      h('h2', { class: 'section' }, 'Orientação padrão dos documentos'),
      h('p', { class: 'muted small' }, 'Já vem marcada ao anexar um documento. Horizontal deita a foto em pé girando só na tela; o arquivo não muda.'),
      orientPadrao));

    // 2 e 3. Senha e imagens do documento
    view.append(h('ul', { class: 'list' },
      listRow({ ic: 'lock', label: 'PIN de acesso', href: '#/senha' }),
      listRow({ ic: 'image', label: 'Imagens do documento', href: '#/imagens' })));

    // 4. Aparência
    const nameIn = h('input', { id: 'appNameIn', type: 'text', maxlength: 40, value: s.appName });
    const colorIn = h('input', { id: 'accentIn', type: 'color', value: s.accent.toLowerCase() });
    const warn = h('p', { class: 'small', role: 'status' });
    const checkColor = () => {
      warn.textContent = contrastWithWhite(colorIn.value) < 4.5 ? 'Esta cor tem pouco contraste com o fundo branco; textos e links podem ficar difíceis de ler.' : '';
      warn.className = warn.textContent ? 'notice' : 'small';
    };
    colorIn.addEventListener('input', checkColor);
    checkColor();
    view.append(h('section', { class: 'card' },
      h('h2', { class: 'section' }, 'Aparência'),
      h('div', { class: 'field' }, h('label', { for: 'appNameIn' }, 'Nome do aplicativo'), nameIn),
      h('div', { class: 'field' }, h('label', { for: 'accentIn' }, 'Cor de destaque'),
        h('div', { class: 'color-row' }, colorIn,
          h('button', { type: 'button', class: 'btn small ghost', onclick: () => { colorIn.value = DEF.accent.toLowerCase(); checkColor(); } }, 'Usar cor padrão'))),
      warn,
      h('button', { type: 'button', class: 'btn primary', onclick: () => {
        const appName = nameIn.value.trim().slice(0, 40) || DEF.appName;
        if (saveSettings({ appName, accent: colorIn.value.toUpperCase() }, 'Aparência salva.')) render();
      } }, 'Salvar aparência')));

    // Texto de créditos (aparece no fim da tela Opções)
    const creditsIn = h('textarea', { id: 'creditsIn', rows: 3, maxlength: 300 });
    creditsIn.value = s.credits;
    view.append(h('section', { class: 'card' },
      h('h2', { class: 'section' }, 'Texto de créditos'),
      h('div', { class: 'field' }, h('label', { for: 'creditsIn' }, 'Aparece no fim da tela Opções. Ex.: "Feito por Maria"'), creditsIn),
      h('button', { type: 'button', class: 'btn primary', onclick: () => {
        saveSettings({ credits: creditsIn.value.trim().slice(0, 300) }, creditsIn.value.trim() ? 'Texto salvo.' : 'Texto removido.');
      } }, 'Salvar texto')));

    // 5. Backup
    const importIn = h('input', { type: 'file', id: 'importInput', accept: 'application/json,.json', class: 'sr-only', tabindex: '-1', 'aria-label': 'Arquivo de backup' });
    importIn.addEventListener('change', async () => {
      const file = importIn.files && importIn.files[0];
      importIn.value = '';
      if (file) importBackup(file);
    });
    view.append(h('section', { class: 'card' },
      h('h2', { class: 'section' }, 'Backup'),
      h('p', { class: 'muted small' }, 'Guarde uma cópia de tudo em um arquivo JSON. O backup inclui os arquivos dos documentos (em base64) e a impressão digital do PIN, nunca o PIN em texto.'),
      importIn,
      h('div', { class: 'row-actions' },
        h('button', { type: 'button', class: 'btn outline', onclick: exportBackup }, 'Exportar backup'),
        h('button', { type: 'button', class: 'btn outline', onclick: () => importIn.click() }, 'Importar backup'))));

    // 6. Apagar tudo
    view.append(h('section', { class: 'card' },
      h('h2', { class: 'section' }, 'Apagar dados'),
      h('p', { class: 'muted small' }, 'Remove documentos, imagens, textos, mensagens e a senha deste aparelho.'),
      h('button', { type: 'button', class: 'btn danger', onclick: async () => {
        if (!(await ui.confirm('Apagar todos os dados?', 'Documentos, imagens, textos, mensagens e senha serão apagados deste aparelho.', 'Continuar', true))) return;
        if (!(await ui.confirm('Tem certeza?', 'Esta ação não pode ser desfeita. Exporte um backup antes se quiser guardar os dados.', 'Apagar tudo', true))) return;
        resetAll();
      } }, 'Apagar todos os dados')));
  },

  imagens() {
    setHeader('Imagens do documento', { back: '#/personalizar' }); setTabs('opcoes');
    const wallets = db.wallets();
    if (!wallets.length) view.append(h('p', { class: 'muted' }, 'Nenhum documento salvo. Adicione um na aba Documentos.'));
    wallets.forEach((w) => {
      const thumb = (b, label) => h('button', { type: 'button', class: 'thumb', 'aria-label': b ? 'Ver ' + label : label + ': sem arquivo',
        onclick: () => (!b ? go('#/editar/' + w.id) : isPdf(b) ? openBlob(b) : ui.viewer(srcOf(b), label)) },
        !b ? [icon('image'), h('span', null, label)] : isPdf(b) ? [icon('doc'), h('span', null, 'PDF')] : h('img', { src: srcOf(b), alt: '' }));
      view.append(h('section', { class: 'card' },
        h('h3', { class: 'sub' }, [w.tipo, w.nome].filter(Boolean).join(' — ') || 'Documento'),
        h('div', { class: 'thumbs' }, thumb(w.front, 'Frente'), thumb(w.back, 'Verso'), thumb(w.qr, 'QR Code')),
        h('button', { type: 'button', class: 'btn outline', onclick: () => go('#/editar/' + w.id) }, 'Editar imagens')));
    });
  }
};

/* ======================================================================
   Ações auxiliares
   ====================================================================== */
async function editService(id) {
  const s = db.services().find((x) => x.id === id);
  if (!s) return;
  const r = await ui.form('Editar serviço', [{ name: 'label', label: 'Texto do item', value: s.label, max: 60 }]);
  if (!r || !r.label.trim()) return;
  const next = db.services().map((x) => (x.id === id ? { ...x, label: r.label.trim() } : x));
  if (store.set(K.services, next)) { ui.toast('Serviço atualizado.'); render(); }
}

/* Toque simples abre; clique triplo ou pressão longa (1,2 s) edita. */
function bindServiceGestures(el, { onTap, onEdit }) {
  let timer = null, sx = 0, sy = 0, longFired = false, clicks = 0, clickTimer = null;
  const cancelLong = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    longFired = false; sx = e.clientX; sy = e.clientY;
    cancelLong();
    timer = setTimeout(() => {
      timer = null; longFired = true; clicks = 0; clearTimeout(clickTimer);
      vibrate(20);
      onEdit();
    }, 1200);
  });
  el.addEventListener('pointermove', (e) => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancelLong(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => el.addEventListener(t, cancelLong));
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('keydown', (e) => { if (e.key === 'F2') { e.preventDefault(); onEdit(); } });
  el.addEventListener('click', (e) => {
    e.preventDefault();
    if (longFired) { longFired = false; return; }
    clicks++;
    clearTimeout(clickTimer);
    if (clicks >= 3) { clicks = 0; onEdit(); return; }
    clickTimer = setTimeout(() => { const c = clicks; clicks = 0; if (c === 1) onTap(); }, 400);
  });
}

function openFile(f) {
  if (f.type === 'image') return ui.viewer(f.data, f.name);
  try {
    const bin = atob(f.data.slice(f.data.indexOf(',') + 1));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = h('a', { href: url, target: '_blank', rel: 'noopener' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { ui.toast('Não foi possível abrir este PDF.'); }
}

async function exportBackup() {
  const data = {};
  Object.entries(K).forEach(([name, key]) => { if (name === 'wallets') return; const v = store.get(key); if (v !== null) data[name] = v; });
  try { data.docs = await Promise.all(docs.list.map((d) => PWC.encodeDoc(d))); }
  catch (e) { return ui.toast('Não foi possível ler os arquivos para o backup.'); }
  const payload = { app: 'pwa-carteira', version: 2, exportedAt: new Date().toISOString(), data };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload)], { type: 'application/json' }));
  const a = h('a', { href: url, download: 'documentos-backup-' + new Date().toISOString().slice(0, 10) + '.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  ui.toast('Backup exportado.');
}

async function importBackup(file) {
  let payload;
  try { payload = JSON.parse(await file.text()); } catch (e) { return ui.toast('Arquivo inválido: não é um backup JSON.'); }
  if (!payload || payload.app !== 'pwa-carteira' || !payload.data || typeof payload.data !== 'object') return ui.toast('Este arquivo não é um backup deste aplicativo.');
  // Documentos: versão 2 traz arquivos em base64; versão 1 (antiga) traz imagens em data URL.
  let newDocs = null;
  try {
    if (Array.isArray(payload.data.docs)) newDocs = payload.data.docs.map((o, i) => normalizeDoc(PWC.decodeDoc(o), i));
    else if (Array.isArray(payload.data.wallets)) newDocs = payload.data.wallets.filter((o) => o && typeof o === 'object').map((o, i) => legacyToDoc(o, i, Date.now()));
  } catch (e) { return ui.toast('Backup com arquivos inválidos. Nada foi alterado.'); }
  if (!(await ui.confirm('Importar backup?', 'Os dados atuais deste aparelho serão substituídos pelos do arquivo.', 'Importar'))) return;
  const old = {};
  Object.values(K).forEach((k) => { try { old[k] = localStorage.getItem(k); } catch (e) { old[k] = null; } });
  const restore = () => Object.entries(old).forEach(([k, v]) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (x) { /* ignora */ } });
  try {
    for (const [name, key] of Object.entries(K)) {
      if (name === 'wallets' || !(name in payload.data)) continue;
      let v = payload.data[name];
      if (name === 'auth') {
        // A credencial biométrica pertence a outro aparelho: desliga.
        if (v && v.none === true && !v.hash) v = { salt: '', hash: '', none: true, bio: { enabled: false, credId: '' } };
        else if (!v || typeof v !== 'object' || !/^[0-9a-f]{64}$/.test(v.hash) || typeof v.salt !== 'string') continue;
        else v = { salt: v.salt, hash: v.hash, bio: { enabled: false, credId: '' } };
      }
      localStorage.setItem(key, JSON.stringify(v));
    }
  } catch (e) {
    restore();
    return ui.toast('Espaço insuficiente para importar este backup. Seus dados atuais foram mantidos.');
  }
  if (newDocs) {
    try { await docs.replaceAll(newDocs); }
    catch (e) { restore(); return ui.toast('Não foi possível guardar os documentos do backup. Seus dados atuais foram mantidos.'); }
  }
  app.unlocked = false;
  applySettings();
  ui.toast('Backup importado. Entre novamente.');
  go('#/login', { replace: true });
}

/* ======================================================================
   Inicialização: splash → criação de senha ou login
   ====================================================================== */
function boot() {
  buildTabs();
  applySettings();
  const splash = $('#splash');
  splash.append(logoNode(true));
  window.addEventListener('hashchange', () => { app.navCount++; render(); });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then(() => applySettings()).catch(() => {}));
  }
  if (ACCESS_SERVER) {
    document.addEventListener('visibilitychange', reconferir);
    setInterval(reconferir, 5 * 60 * 1000);
  }
  Promise.all([docs.init(), ACCESS_SERVER ? gate.conferir() : null, new Promise((r) => setTimeout(r, 1700))]).then(() => {
    render();
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 300);
  });
}
boot();
